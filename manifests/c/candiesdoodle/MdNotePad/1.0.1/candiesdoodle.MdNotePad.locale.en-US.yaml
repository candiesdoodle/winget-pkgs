ShortDescription: A Notepad-style Markdown editor for Windows with formatting you can see while you type.
Description: MdNotePad edits plain .md files in a Windows 11 Notepad look. Headings, bold, links, lists, quotes and code are shown formatted as you type, tables line up as a grid, and Mermaid diagrams are drawn in the editor. It has spell check, find and replace, tabs, an outline panel, Print and Save as PDF, Light, Dark, Paper and Neon themes, and a File Explorer preview pane for .md files. Native, with no web view, no account and no network use.
